<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accordion</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="accordian">
    <div class="title-section">
      <div class="title">Section 1</div>
      <div class="expand-icon">+</div>
      <div class="collapse-icon">-</div>
    </div>
    <div class="description"><div class="content">Content 1</div></div>
  </div>
  <div class="accordian">
    <div class="title-section">
      <div class="title">Section 2</div>
      <div class="expand-icon">+</div>
      <div class="collapse-icon">-</div>
    </div>
    <div class="description"><div class="content">Content 2</div></div>
  </div>
  <div class="accordian">
    <div class="title-section">
      <div class="title">Section 3</div>
      <div class="expand-icon">+</div>
      <div class="collapse-icon">-</div>
    </div>
    <div class="description"><div class="content">Content 3</div></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
