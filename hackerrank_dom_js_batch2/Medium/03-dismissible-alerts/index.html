<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medium - Dismissible Alerts</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="alerts-container">
  <div class="alert"><span>Success alert</span><button class="close-alert">×</button></div>
  <div class="alert"><span>Info alert</span><button class="close-alert">×</button></div>
  <div class="alert"><span>Error alert</span><button class="close-alert">×</button></div>
</div>

  <script src="script.js"></script>
</body>
</html>
