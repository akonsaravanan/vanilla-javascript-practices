<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hard - Expandable Tree View</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<ul id="tree-root">
  <li class="node parent">
    <div class="label">Frontend</div>
    <ul class="children">
      <li class="node"><div class="label">HTML</div></li>
      <li class="node"><div class="label">CSS</div></li>
    </ul>
  </li>
  <li class="node parent">
    <div class="label">Backend</div>
    <ul class="children">
      <li class="node"><div class="label">Java</div></li>
      <li class="node"><div class="label">Spring</div></li>
    </ul>
  </li>
  <li class="node"><div class="label">DevOps</div></li>
</ul>

  <script src="script.js"></script>
</body>
</html>
