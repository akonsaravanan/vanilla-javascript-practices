<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hard - Expandable Tree View - Tests</title>
  <link rel="stylesheet" href="styles.css" />
  <style>#test-results { margin-top: 24px; border-top: 2px solid #ddd; padding-top: 16px; }</style>
</head>
<body>

<ul id="tree-root">
  <li class="node parent">
    <div class="label">Frontend</div>
    <ul class="children">
      <li class="node"><div class="label">HTML</div></li>
      <li class="node"><div class="label">CSS</div></li>
    </ul>
  </li>
  <li class="node parent">
    <div class="label">Backend</div>
    <ul class="children">
      <li class="node"><div class="label">Java</div></li>
      <li class="node"><div class="label">Spring</div></li>
    </ul>
  </li>
  <li class="node"><div class="label">DevOps</div></li>
</ul>

  <div id="test-results"></div>
  <script src="script.js"></script>
  <script src="../../test-utils.js"></script>
  <script src="test.js"></script>
</body>
</html>
