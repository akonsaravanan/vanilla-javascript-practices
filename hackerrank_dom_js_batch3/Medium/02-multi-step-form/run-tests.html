<!DOCTYPE html>
<html>
<head>

  <title>Medium - Multi Step Form - Tests</title>

<div class="step visible" id="step-1">

<div class="step" id="step-3">

  <button class="prev-btn" type="button">Prev</button>
</div>

  <div id="test-results"></div>
